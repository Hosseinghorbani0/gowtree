name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"

jobs:
  quality:
    name: Format, vet, test, and build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(gofmt -l .) | Where-Object { $_.Trim() -ne "" }
          if ($files) {
            Write-Error "The following files are not gofmt-formatted:"
            $files | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -cover ./...

      - name: Build
        run: go build -trimpath -o build\gowtree.exe ./cmd/gowtree
